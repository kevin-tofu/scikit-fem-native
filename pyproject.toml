[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "skfem-native"
version = "0.2.0"
description = "A small native assembly engine for nonlinear finite elements"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["finite-element", "assembly", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/kevin-tofu/skfem-native"
Issues = "https://github.com/kevin-tofu/skfem-native/issues"

[project.optional-dependencies]
test = ["pytest>=8", "scikit-fem>=10", "shapely>=2", "matplotlib>=3.8"]
benchmark = ["scikit-fem>=10", "shapely>=2", "matplotlib>=3.8"]
docs = [
  "sphinx>=8",
  "furo>=2024.8.6",
  "myst-parser>=4",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
]

[tool.scikit-build]
wheel.packages = ["python/skfemntv"]
cmake.build-type = "Release"
sdist.include = [
  "CMakeLists.txt",
  "cpp/include/**/*.hpp",
  "cpp/src/**/*.cpp",
  "benchmarks/**/*.md",
  "benchmarks/**/*.py",
  "python/skfemntv/**/*.py",
  "tests/**/*.py",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux_*", "*-win32", "cp3??t-*"]
test-requires = ["pytest>=8", "scikit-fem>=10", "shapely>=2", "matplotlib>=3.8"]
test-command = "pytest {project}/tests -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
