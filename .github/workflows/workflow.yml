name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check release version
        run: >-
          python tools/check_release_version.py
          "${{ github.event.release.tag_name }}"
      - name: Require a project license
        run: python -c "from pathlib import Path; assert Path('LICENSE').is_file(), 'Add LICENSE before publishing'"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact: linux-x86_64
          - os: macos-15
            platform: macos
            arch: arm64
            artifact: macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            artifact: macos-x86_64
          - os: windows-2025
            platform: windows
            arch: AMD64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and test wheels
        run: |
          python -m pip install "cibuildwheel>=4,<5"
          python tools/build_wheels.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/skfem-native/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
