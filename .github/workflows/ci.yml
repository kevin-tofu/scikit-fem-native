name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "benchmarks/**/results/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "benchmarks/**/results/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-15
            python: "3.14"
          - os: windows-2025
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: python -m pytest

  package:
    name: Validate sdist and wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python tools/package_check.py --smoke-only
